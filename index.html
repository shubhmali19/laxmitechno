<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laxmi Techno — Coming Soon</title>
  <meta name="description" content="Laxmi Techno is coming soon.">
  <style>
    :root {
      --bg: #f6f1e7;
      --ink: #2b2118;
      --muted: #7a6a5a;
      --accent: #c8642b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 520px; }
    .chimp { width: min(280px, 70vw); height: auto; animation: bob 3s ease-in-out infinite; }
    .eye-lid { animation: blink 4.5s infinite; transform-origin: center; transform-box: fill-box; }
    h1 {
      font-size: clamp(2.2rem, 8vw, 3.6rem);
      margin: 16px 0 8px;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: 1.1rem; margin: 0; }
    .brand { margin-top: 28px; font-size: .85rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(0); } 95% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .chimp, .eye-lid { animation: none; } }
  </style>
</head>
<body>
  <main>
    <svg class="chimp" viewBox="0 0 240 240" role="img" aria-label="A friendly cartoon chimpanzee">
      <!-- ears -->
      <circle cx="40" cy="118" r="26" fill="#5a3a22"/>
      <circle cx="40" cy="118" r="15" fill="#e8b98f"/>
      <circle cx="200" cy="118" r="26" fill="#5a3a22"/>
      <circle cx="200" cy="118" r="15" fill="#e8b98f"/>
      <!-- head -->
      <ellipse cx="120" cy="105" rx="82" ry="80" fill="#5a3a22"/>
      <!-- face -->
      <path d="M120 60c-30 0-48 18-48 40 0 12 6 20 14 26-6 6-10 14-10 24 0 22 20 38 44 38s44-16 44-38c0-10-4-18-10-24 8-6 14-14 14-26 0-22-18-40-48-40z" fill="#e8b98f"/>
      <!-- brow -->
      <path d="M78 92c14-12 30-12 42-2 12-10 28-10 42 2" fill="none" stroke="#5a3a22" stroke-width="7" stroke-linecap="round"/>
      <!-- eyes -->
      <circle cx="97" cy="106" r="8" fill="#2b2118"/>
      <circle cx="143" cy="106" r="8" fill="#2b2118"/>
      <circle cx="100" cy="103" r="2.5" fill="#fff"/>
      <circle cx="146" cy="103" r="2.5" fill="#fff"/>
      <ellipse class="eye-lid" cx="97" cy="106" rx="9" ry="9" fill="#e8b98f"/>
      <ellipse class="eye-lid" cx="143" cy="106" rx="9" ry="9" fill="#e8b98f"/>
      <!-- nose -->
      <ellipse cx="111" cy="136" rx="3.5" ry="5" fill="#5a3a22"/>
      <ellipse cx="129" cy="136" rx="3.5" ry="5" fill="#5a3a22"/>
      <!-- smile -->
      <path d="M96 156c14 14 34 14 48 0" fill="none" stroke="#5a3a22" stroke-width="5" stroke-linecap="round"/>
    </svg>

    <h1>Coming <span>Soon</span></h1>
    <p>We're building something new. Check back shortly.</p>
    <div class="brand">Laxmi Techno</div>
  </main>
</body>
</html>
